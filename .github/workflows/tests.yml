name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    services:
      # A real Redis, so the conformance tests check mini-redis against the real thing.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (mini-redis and real Redis)
        env:
          REAL_REDIS_PORT: "6379"
        run: python -m pytest -v
      - name: Smoke test with the real redis-cli
        run: |
          # The official redis-cli from the redis:7 image, sharing the runner's network.
          cli() { docker run --rm --network host redis:7 redis-cli -p 6380 "$@"; }
          python -m minikv --port 6380 &
          for i in $(seq 1 20); do cli PING > /dev/null 2>&1 && break; sleep 0.5; done
          test "$(cli SET greeting hello)" = "OK"
          test "$(cli GET greeting)" = "hello"
          test "$(cli INCRBY visits 5)" = "5"
          # Output captured by a script is "raw" (no "(nil)"), so ask for the formatted form.
          test "$(cli --no-raw -3 GET missing)" = "(nil)"
          echo "redis-cli works against mini-redis (RESP2 and RESP3)"
