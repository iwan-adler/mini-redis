name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    services:
      # A real Redis, so the conformance tests check mini-redis against the real thing.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (mini-redis and real Redis)
        env:
          REAL_REDIS_PORT: "6379"
        run: python -m pytest -v
      - name: Smoke test with the real redis-cli
        run: |
          sudo apt-get install -y -qq redis-tools > /dev/null
          python -m minikv --port 6380 &
          for i in $(seq 1 20); do redis-cli -p 6380 PING > /dev/null 2>&1 && break; sleep 0.25; done
          test "$(redis-cli -p 6380 SET greeting hello)" = "OK"
          test "$(redis-cli -p 6380 GET greeting)" = "hello"
          test "$(redis-cli -p 6380 INCRBY visits 5)" = "5"
          test "$(redis-cli -p 6380 -3 GET missing)" = "(nil)"
          echo "redis-cli works against mini-redis"
